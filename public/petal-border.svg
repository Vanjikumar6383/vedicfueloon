<svg xmlns="http://www.w3.org/2000/svg" width="40" height="16" viewBox="0 0 40 16" fill="none">
  <!-- Top connecting golden garland cord -->
  <line x1="0" y1="1" x2="40" y2="1" stroke="#D4A017" stroke-width="1.5" stroke-opacity="0.9" />
  
  <!-- Scalloped connector arch -->
  <path d="M 0,1 Q 10,6 20,2 Q 30,6 40,1" stroke="#D4A017" stroke-width="1.2" fill="none" opacity="0.8" />
  
  <!-- Left accent petal -->
  <path d="M 10,2.5 C 7.5,5 7,8.5 10,11 C 12.5,8.5 12,5 10,2.5 Z" fill="#D4A017" stroke="#1B3A2D" stroke-width="0.5" opacity="0.9" />
  <!-- Left petal highlight -->
  <circle cx="10" cy="11.2" r="0.9" fill="#FFF275" />

  <!-- Right accent petal -->
  <path d="M 30,2.5 C 27.5,5 27,8.5 30,11 C 32.5,8.5 32,5 30,2.5 Z" fill="#D4A017" stroke="#1B3A2D" stroke-width="0.5" opacity="0.9" />
  <!-- Right petal highlight -->
  <circle cx="30" cy="11.2" r="0.9" fill="#FFF275" />

  <!-- Central Grand Lotus Petal -->
  <path d="M 20,2 C 15,5.5 14,11 20,15.5 C 26,11 25,5.5 20,2 Z" fill="url(#petalGoldGrad)" stroke="#1B3A2D" stroke-width="0.6" />
  <!-- Central inner petal vein / glow -->
  <path d="M 20,4 C 17.5,6.5 17,10 20,13 C 23,10 22.5,6.5 20,4 Z" fill="#FFF275" opacity="0.75" />
  <!-- Bottom drop gem -->
  <circle cx="20" cy="15.2" r="1.1" fill="#FFF9D2" stroke="#B8880F" stroke-width="0.4" />

  <!-- Small side connector dots -->
  <circle cx="0" cy="1" r="1.2" fill="#D4A017" />
  <circle cx="40" cy="1" r="1.2" fill="#D4A017" />

  <defs>
    <linearGradient id="petalGoldGrad" x1="20" y1="2" x2="20" y2="15.5" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F9D776" />
      <stop offset="60%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#B8880F" />
    </linearGradient>
  </defs>
</svg>
