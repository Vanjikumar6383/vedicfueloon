<svg xmlns="http://www.w3.org/2000/svg" width="60" height="30" viewBox="0 0 60 30" fill="none">
  <defs>
    <linearGradient id="goldPetalGrad" x1="0" y1="0" x2="0" y2="28" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="40%" stop-color="#F3C644" />
      <stop offset="75%" stop-color="#D4A017" />
      <stop offset="100%" stop-color="#9A6F09" />
    </linearGradient>
    <linearGradient id="roseAccentGrad" x1="0" y1="0" x2="0" y2="26" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF9EAA" />
      <stop offset="50%" stop-color="#E84393" />
      <stop offset="100%" stop-color="#D63031" />
    </linearGradient>
    <linearGradient id="leafGrad" x1="0" y1="0" x2="0" y2="18" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#55EFC4" />
      <stop offset="100%" stop-color="#00B894" />
    </linearGradient>
  </defs>

  <!-- Top connecting gold braided festoon rope -->
  <path d="M 0,2 Q 15,9 30,3 Q 45,9 60,2" stroke="url(#goldPetalGrad)" stroke-width="2" stroke-linecap="round" fill="none" />
  <path d="M 0,4 Q 15,11 30,5 Q 45,11 60,4" stroke="#FFEAA7" stroke-width="0.8" stroke-dasharray="1.5 2" fill="none" opacity="0.85" />

  <!-- Hanging pearls along the upper garland swag -->
  <circle cx="7.5" cy="5.8" r="1.4" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />
  <circle cx="15" cy="8.2" r="1.6" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />
  <circle cx="22.5" cy="6.2" r="1.4" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />
  <circle cx="37.5" cy="6.2" r="1.4" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />
  <circle cx="45" cy="8.2" r="1.6" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />
  <circle cx="52.5" cy="5.8" r="1.4" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.5" />

  <!-- Twin Mango Leaves behind central lotus -->
  <path d="M 30,8 C 24,10 18,14 19,19 C 24,18 28,14 30,8 Z" fill="url(#leafGrad)" opacity="0.85" stroke="#1B3A2D" stroke-width="0.4" />
  <path d="M 30,8 C 36,10 42,14 41,19 C 36,18 32,14 30,8 Z" fill="url(#leafGrad)" opacity="0.85" stroke="#1B3A2D" stroke-width="0.4" />

  <!-- Left Marigold / Jasmine Blossom -->
  <g transform="translate(15, 11)">
    <circle cx="0" cy="0" r="3.2" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.6" />
    <path d="M 0,-4.2 C -1.5,-3 -1.5,-1 0,0 C 1.5,-1 1.5,-3 0,-4.2 Z" fill="#FFEAA7" />
    <path d="M 4.2,0 C 3,-1.5 1,-1.5 0,0 C 1,1.5 3,1.5 4.2,0 Z" fill="#FFEAA7" />
    <path d="M 0,4.2 C -1.5,3 -1.5,1 0,0 C 1.5,1 1.5,3 0,4.2 Z" fill="#FFEAA7" />
    <path d="M -4.2,0 C -3,-1.5 -1,-1.5 0,0 C -1,1.5 -3,1.5 -4.2,0 Z" fill="#FFEAA7" />
    <circle cx="0" cy="0" r="1.2" fill="#E84393" />
    <path d="M 0,3.2 L 0,6" stroke="#D4A017" stroke-width="0.7" />
    <circle cx="0" cy="6.8" r="1.1" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.4" />
  </g>

  <!-- Right Marigold / Jasmine Blossom -->
  <g transform="translate(45, 11)">
    <circle cx="0" cy="0" r="3.2" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.6" />
    <path d="M 0,-4.2 C -1.5,-3 -1.5,-1 0,0 C 1.5,-1 1.5,-3 0,-4.2 Z" fill="#FFEAA7" />
    <path d="M 4.2,0 C 3,-1.5 1,-1.5 0,0 C 1,1.5 3,1.5 4.2,0 Z" fill="#FFEAA7" />
    <path d="M 0,4.2 C -1.5,3 -1.5,1 0,0 C 1.5,1 1.5,3 0,4.2 Z" fill="#FFEAA7" />
    <path d="M -4.2,0 C -3,-1.5 -1,-1.5 0,0 C -1,1.5 -3,1.5 -4.2,0 Z" fill="#FFEAA7" />
    <circle cx="0" cy="0" r="1.2" fill="#E84393" />
    <path d="M 0,3.2 L 0,6" stroke="#D4A017" stroke-width="0.7" />
    <circle cx="0" cy="6.8" r="1.1" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.4" />
  </g>

  <!-- Central Auspicious Sacred Lotus -->
  <path d="M 30,4 C 20,7 18,17 27,24 C 30,19 32,11 30,4 Z" fill="url(#roseAccentGrad)" opacity="0.9" stroke="#9A6F09" stroke-width="0.5" />
  <path d="M 30,4 C 40,7 42,17 33,24 C 30,19 28,11 30,4 Z" fill="url(#roseAccentGrad)" opacity="0.9" stroke="#9A6F09" stroke-width="0.5" />

  <path d="M 30,3 C 22,7 21,18 29,25 C 30,19 31,10 30,3 Z" fill="url(#goldPetalGrad)" stroke="#B8880F" stroke-width="0.6" />
  <path d="M 30,3 C 38,7 39,18 31,25 C 30,19 29,10 30,3 Z" fill="url(#goldPetalGrad)" stroke="#B8880F" stroke-width="0.6" />

  <path d="M 30,1 C 25,6 24,18 30,26 C 36,18 35,6 30,1 Z" fill="url(#goldPetalGrad)" stroke="#1B3A2D" stroke-width="0.6" />
  <path d="M 30,3 C 27.5,7 27,15 30,22 C 33,15 32.5,7 30,3 Z" fill="#FFFDF0" opacity="0.85" />

  <circle cx="30" cy="14" r="2.2" fill="#E84393" stroke="#FFFDF0" stroke-width="0.6" />
  <circle cx="30" cy="14" r="1.1" fill="#F3C644" />

  <path d="M 30,25.5 L 30,27.5" stroke="#D4A017" stroke-width="0.8" />
  <circle cx="30" cy="28.5" r="1.5" fill="#FFFDF0" stroke="#D4A017" stroke-width="0.6" />

  <!-- Connecting Node Ornaments at Tile Edges -->
  <circle cx="0" cy="2" r="2.2" fill="url(#goldPetalGrad)" stroke="#9A6F09" stroke-width="0.5" />
  <circle cx="0" cy="2" r="1" fill="#E84393" />
  <circle cx="60" cy="2" r="2.2" fill="url(#goldPetalGrad)" stroke="#9A6F09" stroke-width="0.5" />
  <circle cx="60" cy="2" r="1" fill="#E84393" />
</svg>
